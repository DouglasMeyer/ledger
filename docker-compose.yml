services:
  ledger:
    build: .
    command: ./clean_start.sh
    volumes:
      - .:/ledger
    ports:
      - "8002:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      RAILS_ENV: development
    env_file: .env
    networks:
      - default
    restart: unless-stopped

  db:
    image: postgres:13.4
    volumes:
      - ./postgres_data/_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
    restart: unless-stopped
